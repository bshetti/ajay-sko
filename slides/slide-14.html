<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Optimizing for Customer Value</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1280px; height: 720px;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body {
      background: url('green-chapter-background.png') center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      padding: 0 80px;
      max-width: 880px;
      text-align: center;
      opacity: 0;
      animation: slide-in 0.75s ease forwards 0.3s;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .title {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: #1A3FA8;
      margin-bottom: 28px;
    }

    .subtitle {
      font-size: 26px;
      font-weight: 700;
      color: #0B2860;
      margin-bottom: 22px;
      line-height: 1.3;
    }

    .list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: max-content;
      max-width: 100%;
      margin: 0 auto;
    }

    .list li {
      display: flex;
      gap: 14px;
      font-size: 22px;
      font-weight: 500;
      color: #0B2860;
      line-height: 1.4;
      text-align: left;
    }

    .list li .num {
      font-weight: 700;
      min-width: 22px;
    }
  </style>
</head>
<body>

  <div class="content">
    <h1 class="title">Optimizing for<br>Customer Value</h1>
    <p class="subtitle">When to maintain ECH or<br>Self-Managed:</p>
    <ol class="list">
      <li><span class="num">1.</span><span>Strict Air-gapped environments (Total data sovereignty); FedRamp</span></li>
      <li><span class="num">2.</span><span>Custom binary node plugins</span></li>
      <li><span class="num">3.</span><span>"Frozen" legacy version pinning</span></li>
    </ol>
  </div>

<script src="/js/fuckslides.js"></script>
</body>
</html>
