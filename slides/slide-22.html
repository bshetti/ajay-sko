<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Start Now!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1280px; height: 720px;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      background: url('blue-normal-background.png') center / cover no-repeat;
    }
    .slide {
      width: 1280px; height: 720px;
      display: flex;
      align-items: center;
    }

    /* Left content */
    .content {
      width: 560px;
      flex-shrink: 0;
      padding: 56px 60px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .start-title {
      font-size: 72px;
      font-weight: 900;
      color: #5EE6C8;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .start-title span { color: #fff; }

    .commitment-label {
      font-size: 18px;
      font-weight: 700;
      color: rgba(255,255,255,0.85);
    }

    .items { display: flex; flex-direction: column; gap: 16px; }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      opacity: 0;
      animation: slide-in 0.5s ease forwards;
    }
    .item:nth-child(1) { animation-delay: 0.2s; }
    .item:nth-child(2) { animation-delay: 0.35s; }
    .item:nth-child(3) { animation-delay: 0.5s; }
    .item:nth-child(4) { animation-delay: 0.65s; }

    @keyframes slide-in {
      from { opacity: 0; transform: translateX(-16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .item-num {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #2363F4;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: #fff;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .item-text {
      font-size: 17px;
      color: rgba(255,255,255,0.9);
      line-height: 1.45;
    }

    /* Right: vault illustration */
    .visual {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Glow rings */
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(94,230,200,0.15);
      animation: pulse-ring 3s ease-in-out infinite;
    }
    .ring-1 { width: 420px; height: 420px; animation-delay: 0s; }
    .ring-2 { width: 340px; height: 340px; animation-delay: 0.4s; border-color: rgba(94,230,200,0.22); }
    .ring-3 { width: 260px; height: 260px; animation-delay: 0.8s; border-color: rgba(94,230,200,0.3); }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50%       { transform: scale(1.04); opacity: 1; }
    }

    /* Vault SVG */
    .vault-wrap {
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 0 30px rgba(94,230,200,0.35));
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    /* Sparkles */
    .spark {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #5EE6C8;
      animation: sparkle 2.5s ease-in-out infinite;
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50%       { opacity: 1; transform: scale(1); }
    }
    .spark:nth-child(1) { top: 15%; left: 55%;  animation-delay: 0s; }
    .spark:nth-child(2) { top: 20%; right: 12%; animation-delay: 0.6s; }
    .spark:nth-child(3) { bottom: 22%; left: 52%; animation-delay: 1.1s; }
    .spark:nth-child(4) { bottom: 15%; right: 18%; animation-delay: 1.7s; }
    .spark:nth-child(5) { top: 45%; left: 48%;  animation-delay: 0.9s; width: 4px; height: 4px; }
  </style>
</head>
<body>
<div class="slide">

  <div class="content">
    <div class="start-title">Start<br>Now<span>!</span></div>
    <div class="commitment-label">Your Commitment:</div>
    <div class="items">
      <div class="item">
        <div class="item-num">1</div>
        <div class="item-text">Scan your top 3 ECH / Self-Managed accounts.</div>
      </div>
      <div class="item">
        <div class="item-num">2</div>
        <div class="item-text">Identify the Operational Burden.</div>
      </div>
      <div class="item">
        <div class="item-num">3</div>
        <div class="item-text">Map the 8 MEDDPICC criteria.</div>
      </div>
      <div class="item">
        <div class="item-num">4</div>
        <div class="item-text">Bring <strong>ONE deal</strong> to your next 1:1.</div>
      </div>
    </div>
  </div>

  <!-- Right: animated vault graphic -->
  <div class="visual">
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="vault-wrap">
      <svg width="220" height="240" viewBox="0 0 220 240" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Vault body -->
        <rect x="10" y="20" width="200" height="190" rx="18" fill="#1A3FA8" stroke="#5EE6C8" stroke-width="3"/>
        <!-- Vault door -->
        <rect x="30" y="40" width="160" height="150" rx="12" fill="#0F2B6E" stroke="rgba(94,230,200,0.5)" stroke-width="2"/>
        <!-- Spin wheel -->
        <circle cx="110" cy="115" r="52" fill="#0B1B3D" stroke="#5EE6C8" stroke-width="3"/>
        <circle cx="110" cy="115" r="36" fill="#0F2B6E" stroke="rgba(94,230,200,0.4)" stroke-width="1.5"/>
        <circle cx="110" cy="115" r="12" fill="#5EE6C8" opacity="0.9"/>
        <!-- Spokes -->
        <line x1="110" y1="63"  x2="110" y2="80"  stroke="#5EE6C8" stroke-width="3" stroke-linecap="round"/>
        <line x1="110" y1="150" x2="110" y2="167" stroke="#5EE6C8" stroke-width="3" stroke-linecap="round"/>
        <line x1="58"  y1="115" x2="75"  y2="115" stroke="#5EE6C8" stroke-width="3" stroke-linecap="round"/>
        <line x1="145" y1="115" x2="162" y2="115" stroke="#5EE6C8" stroke-width="3" stroke-linecap="round"/>
        <line x1="73"  y1="78"  x2="84"  y2="89"  stroke="#5EE6C8" stroke-width="3" stroke-linecap="round"/>
        <line x1="136" y1="141" x2="147" y2="152" stroke="#5EE6C8" stroke-width="3" stroke-linecap="round"/>
        <line x1="147" y1="78"  x2="136" y2="89"  stroke="#5EE6C8" stroke-width="3" stroke-linecap="round"/>
        <line x1="84"  y1="141" x2="73"  y2="152" stroke="#5EE6C8" stroke-width="3" stroke-linecap="round"/>
        <!-- Handle -->
        <rect x="170" y="108" width="22" height="14" rx="7" fill="#5EE6C8"/>
        <!-- Lock indicators -->
        <rect x="40" y="50" width="8" height="8" rx="2" fill="#5EE6C8" opacity="0.7"/>
        <rect x="172" y="50" width="8" height="8" rx="2" fill="#5EE6C8" opacity="0.7"/>
        <rect x="40" y="172" width="8" height="8" rx="2" fill="#5EE6C8" opacity="0.7"/>
        <rect x="172" y="172" width="8" height="8" rx="2" fill="#5EE6C8" opacity="0.7"/>
        <!-- Leg base -->
        <rect x="40" y="210" width="30" height="16" rx="6" fill="#1A3FA8" stroke="#5EE6C8" stroke-width="2"/>
        <rect x="150" y="210" width="30" height="16" rx="6" fill="#1A3FA8" stroke="#5EE6C8" stroke-width="2"/>
        <!-- Glow overlay -->
        <rect x="10" y="20" width="200" height="190" rx="18" fill="url(#vaultGlow)" opacity="0.15"/>
        <defs>
          <radialGradient id="vaultGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#5EE6C8"/>
            <stop offset="100%" stop-color="#5EE6C8" stop-opacity="0"/>
          </radialGradient>
        </defs>
      </svg>
    </div>
  </div>

</div>
<script src="/js/fuckslides.js"></script>
</body>
</html>
