<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A choice to match every customer's needs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1280px; height: 720px;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      background: url('blue-normal-background.png') center / cover no-repeat;
    }

    .slide {
      width: 1280px; height: 720px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* ── Title ── */
    h1 {
      text-align: center;
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      padding: 40px 60px 0;
      letter-spacing: -0.01em;
    }
    h1 .accent { color: #5EE6C8; }

    /* ── Chart area ── */
    .chart {
      flex: 1;
      position: relative;
      margin: 70px 70px 60px 90px;
    }

    /* Y axis */
    .y-axis {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 1px;
      background: rgba(255,255,255,0.35);
    }
    .y-axis::after {
      content: '';
      position: absolute;
      top: 0; left: -4px;
      border: 5px solid transparent;
      border-bottom: 10px solid rgba(255,255,255,0.35);
    }
    .label-less-time {
      position: absolute;
      left: -80px; top: 0;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }
    .label-more-time {
      position: absolute;
      left: -80px; bottom: 32px;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    /* X axis */
    .x-axis {
      position: absolute;
      left: 0; right: 0; bottom: 32px;
      height: 1px;
      background: rgba(255,255,255,0.35);
    }
    .x-axis::after {
      content: '';
      position: absolute;
      right: -4px; top: -4px;
      border: 5px solid transparent;
      border-left: 10px solid rgba(255,255,255,0.35);
    }
    .label-more-control {
      position: absolute;
      bottom: 12px; left: 8px;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      font-weight: 500;
    }
    .label-more-simplicity {
      position: absolute;
      bottom: 12px; right: 8px;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      font-weight: 500;
    }

    /* ── Product nodes ── */
    .node {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
    }

    .circle {
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #2363F4;
      background: rgba(15, 30, 80, 0.55);
    }
    .circle.serverless {
      border: 5px solid #5EE6C8;
      box-shadow: 0 0 0 3px rgba(94,230,200,0.25);
    }

    .node-label {
      margin-top: 12px;
      text-align: center;
    }
    .node-label strong {
      display: block;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
    }
    .node-label span {
      color: rgba(255,255,255,0.6);
      font-size: 12px;
    }

    /* ── SVG icons inside circles ── */
    .circle svg { opacity: 0.9; }
  </style>
</head>
<body>
<div class="slide">
  <h1>A <span class="accent">choice</span> to match every customer's needs</h1>

  <div class="chart">
    <!-- Axes -->
    <div class="y-axis"></div>
    <div class="x-axis"></div>
    <div class="label-less-time">Less Time</div>
    <div class="label-more-time">More Time</div>
    <div class="label-more-control">More Control</div>
    <div class="label-more-simplicity">More Simplicity</div>

    <!-- Self-Managed: bottom-left -->
    <div class="node" style="left:18%; bottom:14%;">
      <div class="circle" style="width:130px;height:130px;">
        <!-- House icon -->
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="32,8 6,32 14,32 14,56 50,56 50,32 58,32" fill="none" stroke="#2363F4" stroke-width="3" stroke-linejoin="round"/>
          <rect x="24" y="38" width="16" height="18" rx="2" fill="none" stroke="#2363F4" stroke-width="2.5"/>
          <!-- server stack inside house -->
          <rect x="22" y="42" width="20" height="4" rx="1" fill="#E05C1A" opacity="0.8"/>
          <rect x="22" y="48" width="20" height="4" rx="1" fill="#E05C1A" opacity="0.6"/>
          <circle cx="39" cy="44" r="1.2" fill="#fff"/>
          <circle cx="39" cy="50" r="1.2" fill="#fff"/>
        </svg>
      </div>
      <div class="node-label">
        <strong>Elastic Self-Managed</strong>
        <span>Download and run it yourself</span>
      </div>
    </div>

    <!-- Hosted: center -->
    <div class="node" style="left:50%; bottom:27%;">
      <div class="circle" style="width:145px;height:145px;">
        <!-- Cloud icon -->
        <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M52 46H22a14 14 0 1 1 3.2-27.6A18 18 0 1 1 52 46z" fill="none" stroke="#2363F4" stroke-width="3"/>
          <!-- small teal cloud outline -->
          <path d="M44 46H30a8 8 0 1 1 1.8-15.8A10 10 0 1 1 44 46z" fill="none" stroke="#5EE6C8" stroke-width="2" opacity="0.7"/>
        </svg>
      </div>
      <div class="node-label">
        <strong>Elastic Cloud Hosted</strong>
        <span>We orchestrate your servers</span>
      </div>
    </div>

    <!-- Serverless: top-right -->
    <div class="node" style="left:82%; bottom:40%;">
      <div class="circle serverless" style="width:160px;height:160px;">
        <!-- Server rack icon -->
        <svg width="80" height="72" viewBox="0 0 80 72" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="8"  width="60" height="16" rx="3" fill="none" stroke="#2363F4" stroke-width="2.5"/>
          <rect x="10" y="28" width="60" height="16" rx="3" fill="none" stroke="#2363F4" stroke-width="2.5"/>
          <rect x="10" y="48" width="60" height="16" rx="3" fill="none" stroke="#2363F4" stroke-width="2.5"/>
          <circle cx="20" cy="16" r="3" fill="#2363F4"/>
          <circle cx="20" cy="36" r="3" fill="#2363F4"/>
          <circle cx="20" cy="56" r="3" fill="#2363F4"/>
          <!-- diagonal line (serverless strike) -->
          <line x1="55" y1="10" x2="68" y2="62" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="4,3"/>
          <!-- horizontal lines on rack -->
          <line x1="30" y1="14" x2="62" y2="14" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
          <line x1="30" y1="34" x2="62" y2="34" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
          <line x1="30" y1="54" x2="62" y2="54" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="node-label">
        <strong>Elastic Cloud Serverless</strong>
        <span>We manage everything</span>
      </div>
    </div>
  </div>
</div>
<script src="/js/fuckslides.js"></script>
</body>
</html>
