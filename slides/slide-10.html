<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Unhappy Operator – GoDaddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1280px; height: 720px;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    body {
      background: url('slide-10-background.png') right center / cover no-repeat;
      position: relative;
    }

    /* White card on the left */
    .card {
      position: absolute;
      left: 48px;
      top: 50%;
      transform: translateY(-50%);
      width: 520px;
      background: #fff;
      border-radius: 20px;
      padding: 40px 44px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .card-title {
      font-size: 26px;
      font-weight: 800;
      color: #0B1B3D;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .points {
      display: flex;
      flex-direction: column;
      gap: 14px;
      list-style: none;
    }

    .points li {
      display: flex;
      gap: 12px;
      font-size: 15px;
      color: #1a2a4a;
      line-height: 1.5;
    }

    .num {
      font-size: 15px;
      font-weight: 800;
      color: #0B1B3D;
      min-width: 20px;
      flex-shrink: 0;
      padding-top: 1px;
    }

    .card-footer {
      margin-top: 8px;
      padding-top: 16px;
      border-top: 1px solid rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-footer img {
      height: 28px;
      width: auto;
      object-fit: contain;
    }

    .footer-text {
      font-size: 12.5px;
      font-weight: 600;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-title">The Unhappy Operator</div>
    <ol class="points">
      <li><span class="num">1.</span><span>Lean IT team overwhelmed by logging infrastructure management.</span></li>
      <li><span class="num">2.</span><span>Adopted Serverless as the operational "Easy Button" for Azure application logs.</span></li>
      <li><span class="num">3.</span><span>Returned team focus entirely to supporting applications.</span></li>
    </ol>
    <div class="card-footer">
      <img src="logo-godaddy.svg" alt="GoDaddy">
      <span class="footer-text">Aligned 200 Clusters to Serverless</span>
    </div>
  </div>
<script src="/js/fuckslides.js"></script>
</body>
</html>
