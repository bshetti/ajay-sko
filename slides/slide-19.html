<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Marketplace Opportunity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1280px; height: 720px;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      background: url('blue-normal-background.png') center / cover no-repeat;
    }
    .slide {
      width: 1280px; height: 720px;
      display: flex;
      flex-direction: column;
      padding: 48px 60px 44px;
      gap: 0;
    }

    /* Header row */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
    }
    .title { font-size: 34px; font-weight: 800; color: #fff; letter-spacing: -0.02em; }

    .cloud-logos {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .cloud-logos img {
      height: 28px;
      width: auto;
      filter: brightness(0) invert(1);
    }

    /* Stats row */
    .stats {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1px 1fr 1px auto auto auto;
      align-items: center;
      gap: 0;
      margin-bottom: 36px;
    }
    .divider {
      width: 1px;
      height: 120px;
      background: rgba(255,255,255,0.18);
      border-style: dashed;
      border-width: 0 1px 0 0;
      border-color: rgba(255,255,255,0.2);
    }

    .stat { padding: 0 36px; }
    .stat-big {
      font-size: 72px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .stat-sub { font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.6); margin-top: 6px; }

    .stat-pct { padding: 0 24px; }
    .pct-row { display: flex; align-items: baseline; gap: 4px; }
    .pct-pre { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.7); }
    .pct-num { font-size: 64px; font-weight: 900; color: #5EE6C8; letter-spacing: -0.03em; line-height: 1; }
    .pct-pct { font-size: 32px; font-weight: 900; color: #5EE6C8; }
    .pct-sub { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.65); margin-top: 4px; line-height: 1.3; }

    .amp-col { padding: 0 12px; }
    .amp-col span {
      font-size: 40px; font-weight: 900; color: rgba(255,255,255,0.5);
    }

    /* Bottom formula bar */
    .formula {
      display: flex;
      align-items: stretch;
      border-radius: 14px;
      overflow: hidden;
      height: 82px;
    }
    .f-block {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 28px;
      font-size: 19px;
      font-weight: 800;
      color: #fff;
      text-align: center;
      line-height: 1.25;
    }
    .f-block.committed  { background: #2363F4; flex: 1.1; }
    .f-block.plus       { background: #1A52D8; padding: 0 18px; font-size: 28px; }
    .f-block.incentives { background: #1A52D8; flex: 0.8; }
    .f-block.arrow      { background: #1A52D8; padding: 0 16px; font-size: 28px; }
    .f-block.result     { background: #5EE6C8; flex: 1.3; color: #0B1B3D; }

    .sources {
      margin-top: 8px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
    }
    .sources a { color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>
<div class="slide">

  <div class="header">
    <h1 class="title">The Marketplace Opportunity</h1>
    <div class="cloud-logos">
      <img src="logo-aws.svg" alt="AWS">
      <img src="logo-googlecloud.svg" alt="Google Cloud">
      <img src="logo-azure.svg" alt="Microsoft Azure">
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-big">$900B</div>
      <div class="stat-sub">Committed Cloud Spend Backlog</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="stat-big">$Millions</div>
      <div class="stat-sub">Available in incentives</div>
    </div>
    <div class="divider"></div>
    <div class="stat-pct">
      <div class="pct-row">
        <span class="pct-pre">Up to</span>
        <span class="pct-num">12</span><span class="pct-pct">%</span>
      </div>
      <div class="pct-sub">Higher<br>Renewal Rate</div>
    </div>
    <div class="amp-col"><span>&amp;</span></div>
    <div class="stat-pct">
      <div class="pct-row">
        <span class="pct-pre">Up to</span>
        <span class="pct-num">35</span><span class="pct-pct">%</span>
      </div>
      <div class="pct-sub">More N&amp;E<br>via MP</div>
    </div>
  </div>

  <div class="formula">
    <div class="f-block committed">Committed<br>Cloud Spend<br>Backlog</div>
    <div class="f-block plus">+</div>
    <div class="f-block incentives">Incentives</div>
    <div class="f-block arrow">→</div>
    <div class="f-block result">Bigger, stickier deals</div>
  </div>

  <p class="sources">Sources: partnerinsight.io and Elastic SFDC</p>
</div>
<script src="/js/fuckslides.js"></script>
</body>
</html>
